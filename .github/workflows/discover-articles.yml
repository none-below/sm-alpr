name: Discover Articles via RSS

# Polls RSS feeds declared in assets/sources.json (entries with a
# `feed_url` field), filters items by ALPR/Flock keywords, and appends
# matching URLs to the article queue. The dedup in article_queue_add.py
# means re-running over the same feed is a no-op.
#
# Shares the article-registry-bot branch with the hourly crawl
# workflow — both push to the same branch under one PR. They share a
# concurrency group so they don't race.

on:
  schedule:
    - cron: '37 5 * * *'   # daily at 05:37 UTC (off-peak, between cron ticks)
  workflow_dispatch:
    inputs:
      source:
        description: 'Single source domain to process (default all)'
        default: ''
      dry_run:
        description: 'Print would-queue without writing'
        default: 'false'

concurrency:
  group: article-pipeline
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          # See article-registry.yml — full history required for the rebase
          # below to find a common ancestor with origin/article-registry-bot.
          fetch-depth: 0
          token: ${{ secrets.REFRESH_PAT || github.token }}

      - name: Configure git identity
        # Required before any step that may write commits (rebase replay,
        # not just `git commit`). See article-registry.yml for the full
        # incident — `fatal: empty ident name` masked as a "conflicts"
        # error when the rebase wrapper trapped it.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set up long-lived branch
        run: |
          git fetch origin article-registry-bot || true
          if git rev-parse --verify origin/article-registry-bot >/dev/null 2>&1; then
            git checkout article-registry-bot
            # See article-registry.yml for context — never auto-reset to
            # main on rebase failure (it destroys accumulated bot work).
            git rebase origin/main || {
              git rebase --abort
              echo "::error::rebase against origin/main conflicts. Bot branch left untouched — resolve manually. NOT auto-resetting (would destroy unmerged work)."
              exit 1
            }
          else
            git checkout -b article-registry-bot
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Discover via RSS
        run: |
          ARGS=""
          if [ -n "${{ inputs.source }}" ]; then
            ARGS="$ARGS --source ${{ inputs.source }}"
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          # shellcheck disable=SC2086
          uv run python scripts/discover_articles.py $ARGS --rejects-json /tmp/rejects.json

      - name: Triage issue for off-allowlist rejects
        # Only on full runs (scheduled, or manual without a single --source /
        # dry-run), so a partial run can't wrongly close the rolling issue.
        if: ${{ inputs.source == '' && inputs.dry_run != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.REFRESH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          uv run python scripts/discover_reject_issue.py /tmp/rejects.json > /tmp/reject-issue.md || true
          gh label create article-rejects --color FBCA04 \
            --description "Discovery surfaced off-allowlist domains to triage" \
            --force >/dev/null 2>&1 || true
          # Label attach at create has failed silently before (the June
          # 2026 run forked a new unlabeled issue every day because this
          # label-only lookup never matched), so fall back to a title
          # match and re-apply the label after create.
          existing=$(gh issue list --label article-rejects --state open \
                       --json number --jq '.[0].number')
          if [ -z "$existing" ]; then
            existing=$(gh issue list --state open \
                         --search 'in:title "Discovery triage: domains seen but not allow-listed"' \
                         --json number --jq '.[0].number')
          fi
          if [ -s /tmp/reject-issue.md ]; then
            if [ -z "$existing" ]; then
              url=$(gh issue create \
                --title "📥 Discovery triage: domains seen but not allow-listed" \
                --label article-rejects \
                --body-file /tmp/reject-issue.md)
              gh issue edit "$url" --add-label article-rejects || true
            else
              gh issue edit "$existing" --body-file /tmp/reject-issue.md
            fi
          elif [ -n "$existing" ]; then
            gh issue close "$existing" \
              --comment "All surfaced domains triaged — nothing pending. A fresh issue opens if discovery finds new ones."
          fi

      - name: Commit and push
        id: commit
        run: |
          git add assets/articles/queue 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No new URLs discovered"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "has_changes=true" >> "$GITHUB_OUTPUT"
          git commit -m "chore: rss-discovered article URLs"
          git push --force-with-lease origin article-registry-bot

      - name: Build PR body
        if: steps.commit.outputs.has_changes == 'true'
        run: uv run python scripts/article_pr_body.py > /tmp/pr-body.md

      - name: Create or update PR
        if: steps.commit.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.REFRESH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          existing=$(gh pr list --head article-registry-bot --state open \
                       --json number --jq '.[0].number')
          if [ -z "$existing" ]; then
            gh pr create \
              --title "chore: article registry updates" \
              --body-file /tmp/pr-body.md \
              --head article-registry-bot \
              --base main
          else
            gh pr edit "$existing" --body-file /tmp/pr-body.md
          fi
