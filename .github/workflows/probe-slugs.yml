name: Probe Unknown Flock Slugs

# Looks for working Flock transparency portal slugs for agencies whose
# current slug 404s. Runs on its own rate budget (default 3 probes per run)
# separate from refresh-flock-data so neither starves the other. Flock
# rate-limits aggressively, so keep the per-run limit small.

on:
  schedule:
    - cron: '47 * * * *'   # hourly at :47 (offset from refresh-flock-data at :17)
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max HTTP probes this run'
        default: '3'
      agency:
        description: 'Force probe a single agency_id (skips failed_slugs filter)'
        default: ''
      delay:
        description: 'Seconds between probes (jittered)'
        default: '5'

concurrency:
  group: slug-probe
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  probe:
    runs-on: ubuntu-24.04  # not -latest: Playwright 1.58 refuses ubuntu-26.04 ("does not support ffmpeg"), seen 2026-10-27
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          # Need full history so the rebase below can find a common ancestor
          # with origin/slug-probe. With the default shallow clone, rebase
          # replays slug-probe's entire history (back to the initial commit)
          # onto main and conflicts on every binary file added since then.
          fetch-depth: 0
          # PAT (if configured) attributes the resulting PR to a human so
          # CI doesn't require approval-for-bots on every run.
          token: ${{ secrets.REFRESH_PAT || github.token }}

      - name: Configure git identity
        # Required before any step that may write commits (rebase replay,
        # not just `git commit`). See article-registry.yml for the full
        # incident — `fatal: empty ident name` masked as a "conflicts"
        # error when the rebase wrapper trapped it.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set up probe branch
        run: |
          git fetch origin slug-probe || true
          if git rev-parse --verify origin/slug-probe >/dev/null 2>&1; then
            git checkout slug-probe
            # See article-registry.yml — never auto-reset to main on
            # rebase failure. It silently destroys accumulated probe work
            # (registry hits, failed_slugs state). Abort and fail loudly;
            # a human resolves and force-pushes.
            git rebase origin/main || {
              git rebase --abort
              echo "::error::rebase against origin/main conflicts. Bot branch left untouched — resolve manually. NOT auto-resetting (would destroy unmerged work)."
              exit 1
            }
          else
            git checkout -b slug-probe
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/pyproject.toml') }}

      - name: Install real Chrome for Playwright
        # slug_probe launches real Chrome via flock_transparency.launch_browser,
        # same as the refresh crawler: bundled Chromium's TLS fingerprint is
        # 403'd at the edge, which is why the probe found nothing from
        # 2026-09-08 on. Ungated by the cache for the same reason as in
        # refresh-flock-data.yml — it installs outside ~/.cache/ms-playwright.
        run: uv run playwright install chrome --with-deps

      - name: Install Chromium fallback
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: uv run playwright install chromium

      - name: Probe candidate slugs
        id: probe
        run: |
          ARGS="--limit ${{ inputs.limit || '3' }} --delay ${{ inputs.delay || '5' }}"
          if [ -n "${{ inputs.agency }}" ]; then
            ARGS="$ARGS --agency ${{ inputs.agency }}"
          fi
          # shellcheck disable=SC2086
          uv run python scripts/slug_probe.py $ARGS | tee /tmp/probe.log

      - name: Surface parser failures as an issue
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # archive_agency logs `PARSE_ERROR: <slug> <date> :: <error>`
          # whenever a probe hit lands on a Flock portal whose bold
          # headings aren't in _HEADING_MAP. Nothing was committed to
          # the asset tree (archive_agency stages and only commits on
          # full success), so the parser fix is the only follow-up —
          # the next refresh-flock-data crawl will re-capture once
          # the parser is updated.
          #
          # Issue selection and the dedupe guard live in
          # scripts/report_parse_errors.sh, shared with refresh-flock-data.yml.
          cat > /tmp/parse-intro.md <<'EOF'
          slug_probe captured one or more Flock portals the parser
          couldn't read. No partial artifact set was written to the
          asset tree. Add the unrecognized bold headings to
          _HEADING_MAP / _DYNAMIC_HEADINGS in scripts/flock_transparency.py;
          the next crawl will re-capture cleanly.
          EOF
          bash scripts/report_parse_errors.sh /tmp/probe.log /tmp/parse-intro.md

      - name: Commit and push
        id: commit
        run: |
          # The probe writes only its state file and, on a hit, the new
          # slug's capture (.txt/.html/.json/.pdf) plus a
          # .slug_probe_hits/<agency_id>.json hand-off. The registry,
          # .content_hashes.json and .failed_slugs.json belong to the refresh
          # crawler, which applies the hand-off on its next run; when both
          # bots rewrote those sorted files, this branch stopped rebasing onto
          # main (2026-10-22 on).
          git add assets/transparency.flocksafety.com/
          if git diff --cached --quiet; then
            echo "No changes to commit"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "has_changes=true" >> "$GITHUB_OUTPUT"
          # Hit vs. pure state bookkeeping, for the commit message
          if git diff --cached --quiet assets/transparency.flocksafety.com/.slug_probe_hits/; then
            git commit -m "chore: slug probe state update (no hits)"
          else
            git commit -m "chore: slug probe found new Flock portal slug(s)"
          fi
          git push --force-with-lease origin slug-probe

      - name: Create or update PR
        if: steps.commit.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.REFRESH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          existing=$(gh pr list --head slug-probe --state open --json number --jq '.[0].number')
          if [ -z "$existing" ]; then
            gh pr create \
              --title "chore: slug probe finds" \
              --body "Automated rolling slug probe. Each run attempts up to 3 candidate slugs across two tiers: Tier A — registry entries with no flock_active_slug set (peer-outbound discoveries that need a first try). Tier B — registry entries whose flock_active_slug is in failed_slugs.json (variant search on broken slugs). Default budget split is 2:1 favoring tier A because its single-try hit rate is higher. On a hit, the captured page is archived under the new slug and a .slug_probe_hits/<agency_id>.json hand-off is written; the refresh crawler applies it on its first run after this merges (registry promotion, failed-slug cleanup, content hash). The probe never edits the registry, .content_hashes.json or .failed_slugs.json, so this branch and flock-refresh can't conflict." \
              --head slug-probe \
              --base main
          fi
