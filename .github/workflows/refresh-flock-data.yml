name: Refresh Flock Transparency Data

on:
  schedule:
    - cron: '17,47 * * * *'   # every 30 minutes at :17 and :47
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'Number of agencies to refresh (ignored when slugs set)'
        default: '3'
      max_age:
        description: 'Re-crawl if older than N days (ignored when slugs set)'
        default: '7'
      slugs:
        description: 'Specific slug(s) to crawl, space-separated. Bypasses --all/--batch/--max-age when set.'
        default: ''

concurrency:
  group: flock-refresh
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  statuses: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          # Need full history so the rebase below can find a common ancestor
          # with origin/flock-refresh. With the default shallow clone, rebase
          # treats the histories as unrelated and replays every branch commit
          # onto main, blowing up with add/add conflicts on shared files.
          fetch-depth: 0
          # Using a PAT (if configured) makes git push + gh pr create attribute
          # to the PAT owner, so the resulting pull_request event's
          # triggering_actor is a human. Without this, GITHUB_TOKEN-authored
          # events get triggering_actor=github-actions[bot], which trips the
          # "approval required for non-committers" setting on every run.
          token: ${{ secrets.REFRESH_PAT || github.token }}

      - name: Configure git identity
        # Required before any step that may write commits (rebase replay,
        # not just `git commit`). Setting this only in the commit step
        # caused real rebases to fail with `fatal: empty ident name`,
        # which the rebase wrapper masked as a misleading "conflicts"
        # error. Set early so the whole workflow can write commits.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set up refresh branch
        run: |
          git fetch origin flock-refresh || true
          if git rev-parse --verify origin/flock-refresh >/dev/null 2>&1; then
            git checkout flock-refresh
            # See article-registry.yml — never auto-reset to main on rebase
            # failure. It silently destroys accumulated bot work. Abort and
            # fail loudly; a human resolves and force-pushes.
            git rebase origin/main || {
              git rebase --abort
              echo "::error::rebase against origin/main conflicts. Bot branch left untouched — resolve manually. NOT auto-resetting (would destroy unmerged work)."
              exit 1
            }
          else
            git checkout -b flock-refresh
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/uv.lock') }}-v2

      - name: Install Chromium for Playwright
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: uv run playwright install chromium

      - name: Crawl oldest agencies
        id: crawl
        run: |
          if [ -n "${{ inputs.slugs }}" ]; then
            # shellcheck disable=SC2086
            uv run python scripts/flock_transparency.py crawl \
              ${{ inputs.slugs }} \
              --delay 1 | tee /tmp/crawl.log
          else
            uv run python scripts/flock_transparency.py crawl \
              --all \
              --batch ${{ inputs.batch_size || '3' }} \
              --max-age ${{ inputs.max_age || '7' }} \
              --delay 1 | tee /tmp/crawl.log
          fi

      - name: Parse new data
        run: uv run python scripts/flock_transparency.py parse | tee -a /tmp/crawl.log

      - name: Surface parser failures as an issue
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Both crawl and parse log `PARSE_ERROR: <slug> <date> :: <error>`
          # whenever the parser trips on a new format variant (the .txt/.html
          # are still saved, the slug is not permanently quarantined).
          # Surface those into a single rolling issue so we notice. Runs
          # after parse so parse-time-only errors get captured too.
          if [ ! -f /tmp/crawl.log ]; then exit 0; fi
          ERRORS=$(grep -E "PARSE_ERROR: " /tmp/crawl.log | sort -u || true)
          if [ -z "$ERRORS" ]; then exit 0; fi
          {
            echo "Parser tripped on one or more agency portals. Files were"
            echo "saved; re-parse via \`parse --force --slug <slug>\` after"
            echo "fixing the parser."
            echo
            echo '```'
            echo "$ERRORS"
            echo '```'
            echo
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > /tmp/parse-issue-body.md
          EXISTING=$(gh issue list --label parser --state open --json number -q '.[0].number' || true)
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file /tmp/parse-issue-body.md
          else
            gh issue create \
              --title "Parser tripped on a new Flock portal variant" \
              --label parser \
              --body-file /tmp/parse-issue-body.md
          fi

      - name: Install Tesseract (cached)
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: tesseract-ocr
          version: 1.0

      - name: Update registry with new agencies
        run: uv run python scripts/build_agency_registry.py --merge

      - name: Validate build outputs
        run: |
          uv run python scripts/build_sharing_graph.py
          uv run python scripts/build_history.py
          uv run python scripts/build_audit_log.py
          uv run python scripts/build_map.py &
          uv run python scripts/build_report_data.py &
          uv run python scripts/build_justifications.py &
          uv run python scripts/build_dashboard.py &
          uv run python scripts/md_to_pdf.py &
          wait

      - name: Check recipient coordinates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! uv run python scripts/check_recipient_coords.py > /tmp/coord-check.txt 2>&1; then
            cat /tmp/coord-check.txt
            EXISTING=$(gh issue list --label geocoding --state open --json number -q '.[0].number' || true)
            if [ -n "$EXISTING" ]; then
              {
                echo "Updated from flock refresh:"
                echo
                echo '```'
                cat /tmp/coord-check.txt
                echo '```'
              } > /tmp/coord-issue-body.md
              gh issue comment "$EXISTING" --body-file /tmp/coord-issue-body.md
            else
              {
                echo "The following agencies receive data from public agencies but have no lat/lng in the registry:"
                echo
                echo '```'
                cat /tmp/coord-check.txt
                echo '```'
                echo
                echo "Add coordinates to \`assets/agency_registry.json\` so they appear on the sharing map."
              } > /tmp/coord-issue-body.md
              gh issue create \
                --title "Recipients missing coordinates in agency registry" \
                --label geocoding \
                --body-file /tmp/coord-issue-body.md
            fi
          else
            cat /tmp/coord-check.txt
          fi

      - name: Commit and push
        id: commit
        run: |
          git add assets/transparency.flocksafety.com/ assets/agency_registry.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "has_changes=true" >> "$GITHUB_OUTPUT"
          git commit -m "chore: refresh flock transparency data (batch of ${{ inputs.batch_size || '3' }})"
          git push --force-with-lease origin flock-refresh

      - name: Report validate status
        if: steps.commit.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sha=$(git rev-parse HEAD)
          gh api repos/${{ github.repository }}/statuses/$sha \
            -f state=success \
            -f context=validate \
            -f description="Validated by refresh workflow"

      - name: Generate diff summaries
        if: steps.commit.outputs.has_changes == 'true'
        run: |
          # Two diffs: cumulative (for the PR body) and per-batch (used as
          # a fallback comment when the cumulative diff exceeds GitHub's
          # ~65K-char body limit).
          #
          # Both must filter to actually-changed slugs — if no slug args
          # are passed, diff_scrapes.py falls through to "diff every
          # agency in the dataset," which dumps ~200 unrelated agencies
          # into the PR.
          slugs_cum=$(git diff origin/main...HEAD --name-only -- 'assets/transparency.flocksafety.com/' \
            | sed 's|assets/transparency.flocksafety.com/||' | cut -d/ -f1 | sort -u)
          if [ -n "$slugs_cum" ]; then
            uv run python scripts/diff_scrapes.py $slugs_cum > /tmp/diff-cumulative.txt
          else
            echo "No agency scrape files changed since main." > /tmp/diff-cumulative.txt
          fi

          slugs_batch=$(git diff HEAD~1 --name-only -- 'assets/transparency.flocksafety.com/' \
            | sed 's|assets/transparency.flocksafety.com/||' | cut -d/ -f1 | sort -u)
          if [ -n "$slugs_batch" ]; then
            uv run python scripts/diff_scrapes.py $slugs_batch > /tmp/diff-batch.txt
          else
            echo "No agency scrape files changed in this batch." > /tmp/diff-batch.txt
          fi

          cat /tmp/diff-cumulative.txt

      - name: Create or update PR
        if: steps.commit.outputs.has_changes == 'true'
        env:
          # Use the PAT (if set) so the PR is created by a human identity,
          # which keeps the next CI run on this PR from requiring manual
          # approval. Falls back to GITHUB_TOKEN when PAT isn't configured.
          GH_TOKEN: ${{ secrets.REFRESH_PAT || secrets.GITHUB_TOKEN }}
          BATCH_SIZE: ${{ inputs.batch_size || '3' }}
        run: |
          BODY_INTRO=$'Automated rolling refresh of Flock Safety transparency portal data.\n\nThis PR accumulates hourly batches. Merge when ready — the next run will create a fresh branch from main.'

          {
            echo "$BODY_INTRO"
            echo
            echo "### Cumulative diff vs main"
            echo
            echo '```'
            cat /tmp/diff-cumulative.txt
            echo '```'
          } > /tmp/pr-body.md

          # GitHub caps body at ~65,536 chars. Once the cumulative diff
          # would blow past that, freeze the body (last cumulative
          # snapshot that fit) and switch to per-batch comments. Reading
          # the body + comments in order gives the full picture.
          OVERFLOW=false
          if [ "$(wc -c < /tmp/pr-body.md)" -gt 60000 ]; then
            OVERFLOW=true
          fi

          existing=$(gh pr list --head flock-refresh --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            pr_num="$existing"
            if [ "$OVERFLOW" = "false" ]; then
              gh pr edit "$pr_num" --body-file /tmp/pr-body.md
            fi
          else
            # First run on a fresh branch — body is small by definition,
            # so OVERFLOW can't be true here.
            gh pr create \
              --title "chore: refresh flock transparency data" \
              --body-file /tmp/pr-body.md \
              --head flock-refresh \
              --base main
            pr_num=$(gh pr list --head flock-refresh --state open --json number --jq '.[0].number')
          fi

          if [ "$OVERFLOW" = "true" ]; then
            {
              echo "### Refresh batch — ${BATCH_SIZE} agencies"
              echo
              echo "_Cumulative diff vs main exceeds GitHub's PR-body limit; this batch is posted as a comment. Body shows the last cumulative snapshot that fit._"
              echo
              echo '```'
              cat /tmp/diff-batch.txt
              echo '```'
            } > /tmp/pr-comment.md
            gh pr comment "$pr_num" --body-file /tmp/pr-comment.md
          fi
