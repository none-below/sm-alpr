name: Refresh Flock Transparency Data

on:
  schedule:
    - cron: '17,47 * * * *'   # every 30 minutes at :17 and :47
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'Number of agencies to refresh (ignored when slugs set)'
        default: '3'
      max_age:
        description: 'Re-crawl if older than N days (ignored when slugs set)'
        default: '7'
      slugs:
        description: 'Specific slug(s) to crawl, space-separated. Bypasses --all/--batch/--max-age when set.'
        default: ''

concurrency:
  group: flock-refresh
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  statuses: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          # Need full history so the rebase below can find a common ancestor
          # with origin/flock-refresh. With the default shallow clone, rebase
          # treats the histories as unrelated and replays every branch commit
          # onto main, blowing up with add/add conflicts on shared files.
          fetch-depth: 0
          # Using a PAT (if configured) makes git push + gh pr create attribute
          # to the PAT owner, so the resulting pull_request event's
          # triggering_actor is a human. Without this, GITHUB_TOKEN-authored
          # events get triggering_actor=github-actions[bot], which trips the
          # "approval required for non-committers" setting on every run.
          token: ${{ secrets.REFRESH_PAT || github.token }}

      - name: Configure git identity
        # Required before any step that may write commits (rebase replay,
        # not just `git commit`). Setting this only in the commit step
        # caused real rebases to fail with `fatal: empty ident name`,
        # which the rebase wrapper masked as a misleading "conflicts"
        # error. Set early so the whole workflow can write commits.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set up refresh branch
        run: |
          git fetch origin flock-refresh || true
          if git rev-parse --verify origin/flock-refresh >/dev/null 2>&1; then
            git checkout flock-refresh
            # See article-registry.yml — never auto-reset to main on rebase
            # failure. It silently destroys accumulated bot work. Abort and
            # fail loudly; a human resolves and force-pushes.
            git rebase origin/main || {
              git rebase --abort
              echo "::error::rebase against origin/main conflicts. Bot branch left untouched — resolve manually. NOT auto-resetting (would destroy unmerged work)."
              exit 1
            }
          else
            git checkout -b flock-refresh
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/uv.lock') }}-v2

      - name: Install real Chrome for Playwright
        # The crawler launches with channel="chrome" so its TLS handshake
        # fingerprint (JA3/JA4) matches the real-user population. Bundled
        # Chromium's does not, and Flock's edge 403s it — that is what
        # blocked the entire rotation from 2026-08-17 onward. Ungated by the
        # cache: `playwright install chrome` shells out to the OS package
        # manager, so it lands outside ~/.cache/ms-playwright and a cache hit
        # would otherwise skip it and leave no Chrome on the runner.
        run: uv run playwright install chrome --with-deps

      - name: Install Chromium fallback
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: uv run playwright install chromium

      - name: Crawl oldest agencies
        id: crawl
        run: |
          # pipefail is load-bearing: without it `| tee` reports tee's exit
          # status and the crawler's non-zero "everything failed" code is
          # swallowed, which is half of why four days of total failure looked
          # green. Record rc rather than dying here — the attempt log written
          # by the crawl still needs to be committed below, otherwise the
          # queue can never rotate past the slugs that just failed. The job
          # is failed for real in the last step.
          set -o pipefail
          rc=0
          if [ -n "${{ inputs.slugs }}" ]; then
            # shellcheck disable=SC2086
            uv run python scripts/flock_transparency.py crawl \
              ${{ inputs.slugs }} \
              --delay 1 | tee /tmp/crawl.log || rc=$?
          else
            uv run python scripts/flock_transparency.py crawl \
              --all \
              --batch ${{ inputs.batch_size || '3' }} \
              --max-age ${{ inputs.max_age || '7' }} \
              --delay 1 | tee /tmp/crawl.log || rc=$?
          fi
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" -ne 0 ]; then
            echo "::warning::Crawl captured nothing (exit $rc). Persisting the attempt log, then failing this job at the end."
          fi

      - name: Parse new data
        run: uv run python scripts/flock_transparency.py parse | tee -a /tmp/crawl.log

      - name: Surface parser failures as an issue
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Both crawl and parse log `PARSE_ERROR: <slug> <date> :: <error>`
          # whenever the parser trips on a new format variant (the .txt/.html
          # are still saved, the slug is not permanently quarantined).
          # Surface those into a single rolling issue so we notice. Runs
          # after parse so parse-time-only errors get captured too.
          if [ ! -f /tmp/crawl.log ]; then exit 0; fi
          ERRORS=$(grep -E "PARSE_ERROR: " /tmp/crawl.log | sort -u || true)
          if [ -z "$ERRORS" ]; then exit 0; fi
          ERRORS_HASH=$(echo "$ERRORS" | sha256sum | cut -d' ' -f1)
          {
            echo "Parser tripped on one or more agency portals. Files were"
            echo "saved; re-parse via \`parse --force --slug <slug>\` after"
            echo "fixing the parser."
            echo
            echo '```'
            echo "$ERRORS"
            echo '```'
            echo
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo "<!-- parse-errors-hash: $ERRORS_HASH -->"
          } > /tmp/parse-issue-body.md
          EXISTING=$(gh issue list --label parser --state open --json number -q '.[0].number' || true)
          if [ -n "$EXISTING" ]; then
            # Skip the comment when this run's errors match the newest ones
            # already on the issue — repeat failures on every refresh run
            # flooded the rolling issue with identical comments (#223).
            LAST_HASH=$(gh issue view "$EXISTING" --json body,comments \
              -q '[.body, (.comments[-1].body // "")] | join("\n")' \
              | grep -oE 'parse-errors-hash: [0-9a-f]+' | tail -1 || true)
            if [ "$LAST_HASH" = "parse-errors-hash: $ERRORS_HASH" ]; then
              echo "Same parse errors already reported on issue #$EXISTING; not commenting."
            else
              gh issue comment "$EXISTING" --body-file /tmp/parse-issue-body.md
            fi
          else
            gh issue create \
              --title "Parser tripped on a new Flock portal variant" \
              --label parser \
              --body-file /tmp/parse-issue-body.md
          fi

      - name: Install Tesseract (cached)
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: tesseract-ocr
          version: 1.0

      - name: Update registry with new agencies
        run: uv run python scripts/build_agency_registry.py --merge

      - name: Validate build outputs
        run: |
          uv run python scripts/build_sharing_graph.py
          uv run python scripts/build_history.py
          uv run python scripts/build_audit_log.py
          uv run python scripts/build_map.py &
          uv run python scripts/build_report_data.py &
          uv run python scripts/build_justifications.py &
          uv run python scripts/build_dashboard.py &
          uv run python scripts/md_to_pdf.py &
          wait

      - name: Check recipient coordinates
        # Reporting-only, like "Surface parser failures as an issue" above —
        # never fail the job. Missing coordinates are a cosmetic map gap, but
        # a failure here skips "Commit and push", so every crawl of the run is
        # thrown away and the same agencies are re-crawled next run. That is
        # what happened from 2026-08-15 on: issue #673 crossed GitHub's
        # 2500-comment ceiling, `gh issue comment` started returning
        # "Commenting is disabled on issues with more than 2500 comments",
        # and a week of refreshes never landed.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if uv run python scripts/check_recipient_coords.py > /tmp/coord-check.txt 2>&1; then
            cat /tmp/coord-check.txt
            exit 0
          fi
          cat /tmp/coord-check.txt
          {
            echo "The following agencies receive data from public agencies but have no lat/lng in the registry:"
            echo
            echo '```'
            cat /tmp/coord-check.txt
            echo '```'
            echo
            echo "Add coordinates to \`assets/agency_registry.json\` so they appear on the sharing map."
          } > /tmp/coord-issue-body.md
          EXISTING=$(gh issue list --label geocoding --state open --json number -q '.[0].number' || true)
          if [ -z "$EXISTING" ]; then
            gh issue create \
              --title "Recipients missing coordinates in agency registry" \
              --label geocoding \
              --body-file /tmp/coord-issue-body.md
            exit 0
          fi
          # The issue body is bot-owned and always holds the current list.
          # Only touch the issue when the list changes — commenting the full
          # list on every refresh run flooded the issue with hundreds of
          # identical comments (#516, #636).
          gh issue view "$EXISTING" --json body -q .body | tr -d '\r' > /tmp/coord-issue-old.raw
          # Normalize trailing newlines on BOTH sides before comparing.
          # `--json body -q .body` pipes the stored body through jq -r, which
          # appends its own newline to a body GitHub already stored with one,
          # so the fetched copy is always exactly one blank line longer than
          # the file just built above. diff therefore reported "changed" on
          # every single run even when the list was byte-identical, and the
          # changelog rendered EMPTY because the sole differing line is a bare
          # "-" that the grep below filters out. That is what drove #673 into
          # GitHub's 2500-comment cap: 1,643 of its 2,500 comments (66%) were
          # empty-diff no-ops. `$(cat …)` strips all trailing newlines and
          # printf restores exactly one, making both sides canonical.
          printf '%s\n' "$(cat /tmp/coord-issue-old.raw)" > /tmp/coord-issue-old.md
          printf '%s\n' "$(cat /tmp/coord-issue-body.md)" > /tmp/coord-issue-new.md
          if diff -u /tmp/coord-issue-old.md /tmp/coord-issue-new.md > /tmp/coord-issue-diff.txt; then
            echo "Recipient list unchanged; leaving issue #$EXISTING alone."
            exit 0
          fi
          # Second guard, independent of the first: never post a changelog
          # with nothing in it. If every differing line is blank or a diff
          # header, the rendered comment carries no information, so update the
          # body (the durable signal) and stop.
          grep -E '^[-+][^-+]' /tmp/coord-issue-diff.txt > /tmp/coord-issue-changes.txt || true
          gh issue edit "$EXISTING" --body-file /tmp/coord-issue-new.md
          if [ ! -s /tmp/coord-issue-changes.txt ]; then
            echo "Only formatting differed; body refreshed on #$EXISTING, no comment posted."
            exit 0
          fi
          {
            echo "Recipient list changed:"
            echo
            echo '```diff'
            cat /tmp/coord-issue-changes.txt
            echo '```'
          } > /tmp/coord-issue-comment.md
          gh issue comment "$EXISTING" --body-file /tmp/coord-issue-comment.md

      - name: Commit and push
        id: commit
        run: |
          git add assets/transparency.flocksafety.com/ assets/agency_registry.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "has_changes=true" >> "$GITHUB_OUTPUT"
          git commit -m "chore: refresh flock transparency data (batch of ${{ inputs.batch_size || '3' }})"
          git push --force-with-lease origin flock-refresh

      - name: Report validate status
        if: steps.commit.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sha=$(git rev-parse HEAD)
          gh api repos/${{ github.repository }}/statuses/$sha \
            -f state=success \
            -f context=validate \
            -f description="Validated by refresh workflow"

      - name: Generate diff summaries
        if: steps.commit.outputs.has_changes == 'true'
        run: |
          # Two diffs: cumulative (for the PR body) and per-batch (used as
          # a fallback comment when the cumulative diff exceeds GitHub's
          # ~65K-char body limit).
          #
          # Both must filter to actually-changed slugs — if no slug args
          # are passed, diff_scrapes.py falls through to "diff every
          # agency in the dataset," which dumps ~200 unrelated agencies
          # into the PR.
          slugs_cum=$(git diff origin/main...HEAD --name-only -- 'assets/transparency.flocksafety.com/' \
            | sed 's|assets/transparency.flocksafety.com/||' | cut -d/ -f1 | grep -v '^\.' | sort -u)
          if [ -n "$slugs_cum" ]; then
            uv run python scripts/diff_scrapes.py $slugs_cum > /tmp/diff-cumulative.txt
          else
            echo "No agency scrape files changed since main." > /tmp/diff-cumulative.txt
          fi

          slugs_batch=$(git diff HEAD~1 --name-only -- 'assets/transparency.flocksafety.com/' \
            | sed 's|assets/transparency.flocksafety.com/||' | cut -d/ -f1 | grep -v '^\.' | sort -u)
          if [ -n "$slugs_batch" ]; then
            uv run python scripts/diff_scrapes.py $slugs_batch > /tmp/diff-batch.txt
          else
            echo "No agency scrape files changed in this batch." > /tmp/diff-batch.txt
          fi

          cat /tmp/diff-cumulative.txt

      - name: Create or update PR
        if: steps.commit.outputs.has_changes == 'true'
        env:
          # Use the PAT (if set) so the PR is created by a human identity,
          # which keeps the next CI run on this PR from requiring manual
          # approval. Falls back to GITHUB_TOKEN when PAT isn't configured.
          GH_TOKEN: ${{ secrets.REFRESH_PAT || secrets.GITHUB_TOKEN }}
          BATCH_SIZE: ${{ inputs.batch_size || '3' }}
        run: |
          BODY_INTRO=$'Automated rolling refresh of Flock Safety transparency portal data.\n\nThis PR accumulates hourly batches. Merge when ready — the next run will create a fresh branch from main.'

          {
            echo "$BODY_INTRO"
            echo
            echo "### Cumulative diff vs main"
            echo
            echo '```'
            cat /tmp/diff-cumulative.txt
            echo '```'
          } > /tmp/pr-body.md

          # GitHub caps body at ~65,536 chars. Once the cumulative diff
          # would blow past that, freeze the body (last cumulative
          # snapshot that fit) and switch to per-batch comments. Reading
          # the body + comments in order gives the full picture.
          OVERFLOW=false
          if [ "$(wc -c < /tmp/pr-body.md)" -gt 60000 ]; then
            OVERFLOW=true
          fi

          existing=$(gh pr list --head flock-refresh --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            pr_num="$existing"
            if [ "$OVERFLOW" = "false" ]; then
              gh pr edit "$pr_num" --body-file /tmp/pr-body.md
            fi
          else
            # First run on a fresh branch — body is small by definition,
            # so OVERFLOW can't be true here.
            gh pr create \
              --title "chore: refresh flock transparency data" \
              --body-file /tmp/pr-body.md \
              --head flock-refresh \
              --base main
            pr_num=$(gh pr list --head flock-refresh --state open --json number --jq '.[0].number')
          fi

          if [ "$OVERFLOW" = "true" ]; then
            {
              echo "### Refresh batch — ${BATCH_SIZE} agencies"
              echo
              echo "_Cumulative diff vs main exceeds GitHub's PR-body limit; this batch is posted as a comment. Body shows the last cumulative snapshot that fit._"
              echo
              echo '```'
              cat /tmp/diff-batch.txt
              echo '```'
            } > /tmp/pr-comment.md
            gh pr comment "$pr_num" --body-file /tmp/pr-comment.md
          fi

      - name: Fail if the crawl was fully blocked
        # Runs last so the attempt log and any partial state are committed
        # first. A red run here means "the crawler is blocked", which is a
        # genuinely different condition from "nothing changed upstream" —
        # the latter still exits 0 and stays green.
        if: steps.crawl.outputs.rc != '0'
        run: |
          echo "::error::Every portal in this batch failed — the refresh is blocked, not caught up. See the Crawl step log for the failure mode (edge 403 / rate limit / parse error)."
          exit 1
